name: Ollama AI Processing

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ai-processing:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Initialize correlation tracking
      run: |
        python -c "
        import sys
        import os
        sys.path.append('.')
        from monitoring.correlation import generate_correlation_id
        
        corr_id = generate_correlation_id()
        
        # Export for other steps
        with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f'CORRELATION_ID={corr_id}\n')
        
        print(f'Workflow correlation ID: {corr_id}')
        "

    - name: System information
      run: |
        echo "Runner OS: ${{ runner.os }}"
        echo "Correlation ID: $CORRELATION_ID"
        echo "Available disk space:"
        df -h
        echo "Available memory:"
        free -h
        echo "CPU information:"
        nproc

    - name: Cache Ollama installation
      uses: actions/cache@v3
      id: ollama-cache
      with:
        path: ~/ollama-bin
        key: ollama-install-${{ runner.os }}-v1

    - name: Cache Ollama models
      uses: actions/cache@v3
      id: model-cache
      with:
        path: ~/.ollama
        key: ollama-models-${{ runner.os }}-${{ hashFiles('config.yaml') }}
        restore-keys: |
          ollama-models-${{ runner.os }}-

    - name: Install Ollama
      run: |
        if [ -f ~/ollama-bin/ollama ]; then
          echo "✓ Using cached Ollama installation"
          sudo cp ~/ollama-bin/ollama /usr/local/bin/ollama
          sudo chmod +x /usr/local/bin/ollama
        else
          echo "↓ Installing Ollama (first run)..."
          curl -fsSL https://ollama.com/install.sh | sh
          mkdir -p ~/ollama-bin
          cp /usr/local/bin/ollama ~/ollama-bin/
          echo "✓ Cached Ollama binary for future runs"
        fi

    - name: Verify Ollama installation
      run: |
        ollama --version
        echo "Cache hit: ${{ steps.ollama-cache.outputs.cache-hit }}"
        if [ -f ~/ollama-bin/ollama ]; then
          echo "Binary size: $(du -h ~/ollama-bin/ollama | cut -f1)"
        fi

    - name: Start Ollama service
      run: |
        ollama serve &
        sleep 10

    - name: Download model with recovery
      run: |
        python -c "
        import subprocess
        import sys
        import os
        sys.path.append('.')
        
        from monitoring.correlation import set_correlation_id
        from monitoring.incident_responder import IncidentResponder
        
        # Restore correlation ID
        set_correlation_id(os.environ.get('CORRELATION_ID', 'unknown'))
        
        responder = IncidentResponder(max_attempts=3)
        
        # Check if model exists
        result = subprocess.run(['ollama', 'list'], capture_output=True, text=True)
        if 'llama3.2:1b' in result.stdout:
            print('Model already available')
        else:
            print('Downloading model...')
            try:
                subprocess.run(['ollama', 'pull', 'llama3.2:1b'], check=True)
                print('Model download successful')
            except Exception as e:
                print(f'Download failed, attempting recovery...')
                if not responder.handle_model_failure('llama3.2:1b', str(e)):
                    print('Recovery failed!')
                    sys.exit(1)
        "

    - name: Download models from config
      run: |
        python -c "
        import yaml
        from pathlib import Path
        import subprocess
        import os
        import sys
        sys.path.append('.')
        from monitoring.correlation import set_correlation_id
        
        set_correlation_id(os.environ.get('CORRELATION_ID', 'unknown'))
        
        config_path = Path('config.yaml')
        if config_path.exists():
            with open(config_path) as f:
                config = yaml.safe_load(f)
            
            models = set()
            models.add(config.get('models', {}).get('classifier', 'llama3.2:1b'))
            models.add(config.get('models', {}).get('default', 'llama3.2:1b'))
            for model in config.get('model_assignments', {}).values():
                models.add(model)
            
            print(f'Models to ensure available: {models}')
            for model in models:
                result = subprocess.run(['ollama', 'list'], capture_output=True, text=True)
                if model not in result.stdout:
                    print(f'Downloading: {model}')
                    subprocess.run(['ollama', 'pull', model], check=True)
                else:
                    print(f'Already available: {model}')
        "

    - name: Verify model availability
      run: |
        echo "Available models:"
        ollama list
        echo "Model download complete"

    - name: Initialize enterprise monitoring
      run: |
        python -c "
        import sys
        import os
        sys.path.append('.')
        from monitoring.correlation import set_correlation_id
        from monitoring.dashboard import WorkflowMonitor
        
        set_correlation_id(os.environ.get('CORRELATION_ID', 'unknown'))
        
        monitor = WorkflowMonitor('ollama-enterprise')
        monitor.start_monitoring('${{ github.run_number }}', '${{ github.sha }}')
        print('Enterprise monitoring initialized')
        "

    - name: Run monitored test suite
      run: |
        python -c "
        import sys
        import time
        import os
        sys.path.append('.')
        from monitoring.correlation import set_correlation_id
        from monitoring.dashboard import WorkflowMonitor
        from scripts.test_runner import run_all_tests
        
        set_correlation_id(os.environ.get('CORRELATION_ID', 'unknown'))
        
        monitor = WorkflowMonitor('ollama-enterprise')
        monitor.start_monitoring('${{ github.run_number }}', '${{ github.sha }}')
        
        start = time.time()
        try:
            with monitor.logger.timer('test_execution'):
                success = run_all_tests()
            duration = time.time() - start
            monitor.monitor_operation('test_execution', duration, success)
        except Exception as e:
            duration = time.time() - start
            monitor.track_error('test_execution_failed', str(e))
            monitor.monitor_operation('test_execution', duration, False)
        "
      continue-on-error: true

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run critical tests
      run: |
        python -m pytest tests/ -m critical -v --tb=short

    - name: Run all tests with coverage
      run: |
        python -m pytest tests/ -v --cov=tests --cov-report=xml --junitxml=test-results.xml 2>&1 | tee test-output.txt

    - name: Run advisory tests
      continue-on-error: true
      run: |
        python -m pytest tests/ -m advisory -v --tb=short

    - name: Performance benchmarking
      run: |
        echo "=== Workflow Performance Report ===" > performance-report.txt
        echo "Timestamp: $(date)" >> performance-report.txt
        echo "Workflow Run: ${{ github.run_number }}" >> performance-report.txt
        echo "Correlation ID: $CORRELATION_ID" >> performance-report.txt
        echo "Cache Hit: ${{ steps.ollama-cache.outputs.cache-hit }}" >> performance-report.txt
        
        echo "Testing AI response time..." >> performance-report.txt
        start_time=$(date +%s)
        ollama run llama3.2:1b "What is continuous integration?" > ai_response.txt
        end_time=$(date +%s)
        response_time=$((end_time - start_time))
        
        echo "AI Response Time: ${response_time} seconds" >> performance-report.txt
        echo "Response Length: $(wc -w < ai_response.txt) words" >> performance-report.txt
        
        cat performance-report.txt

    - name: Upload performance report
      uses: actions/upload-artifact@v4
      with:
        name: performance-report-${{ github.run_number }}
        path: performance-report.txt
        retention-days: 30

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-run-${{ github.run_number }}
        path: |
          test-results.xml
          coverage.xml
          test-output.txt
        retention-days: 30

    - name: Configure git for automated commits
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Run multi-model analysis
      run: |
        python -c "
        import sys
        import os
        sys.path.append('.')
        
        from monitoring.correlation import set_correlation_id
        from ollama_pipeline import load_config, ModelRouter, ResultStorage
        from pathlib import Path
        
        set_correlation_id(os.environ.get('CORRELATION_ID', 'unknown'))
        
        config = load_config()
        router = ModelRouter(config)
        storage = ResultStorage('results')
        
        run_dir = storage.create_run_directory('${{ github.run_number }}')
        
        # Save the directory path for other steps
        with open('current_result_dir.txt', 'w') as f:
            f.write(str(run_dir))
        
        workflow_content = Path('.github/workflows/ollama-basic.yml').read_text()
        
        result = router.analyze(workflow_content)
        
        if result['success'] and result['analysis']:
            storage.save_analysis('workflow-analysis.txt', result['analysis'], {
                'task_type': result['task_type'],
                'model_used': result['model_used'],
                'timing': result['timing']
            })
        
        storage.save_metadata({
            'workflow_run': '${{ github.run_number }}',
            'commit_sha': '${{ github.sha }}',
            'correlation_id': os.environ.get('CORRELATION_ID', 'unknown'),
            'task_type': result['task_type'],
            'model_used': result['model_used'],
            'classification_time': result['timing']['classification'],
            'analysis_time': result['timing']['analysis'],
            'total_time': result['timing']['total']
        })
        
        # Create workflow_summary.json for historical reporting
        storage.commit_all(
            workflow_run='${{ github.run_number }}',
            commit_sha='${{ github.sha }}'
        )
        
        with open('analysis_result.txt', 'w') as f:
            f.write(f\"task_type={result['task_type']}\n\")
            f.write(f\"model_used={result['model_used']}\n\")
            f.write(f\"success={result['success']}\n\")
            f.write(f\"total_time={result['timing']['total']}\n\")
        
        print('Analysis complete!')
        "

    - name: Generate historical report
      run: |
        python scripts/generate_report.py --results-dir results --output results/historical_report.md

    - name: Commit results to repository
      run: |
        RESULT_DIR=$(cat current_result_dir.txt)
        
        git add results/
        git commit -m "Add results from workflow run #${{ github.run_number }}" || echo "No changes to commit"
        git push origin main || echo "Push failed - may need permissions"
      continue-on-error: true

    - name: Upload results to S3 with protection
      if: always()
      run: |
        python -c "
        import sys
        import os
        sys.path.append('.')
        
        from monitoring.correlation import set_correlation_id
        from cloud.s3_manager import S3Manager
        from pathlib import Path
        
        # Restore correlation ID
        set_correlation_id(os.environ.get('CORRELATION_ID', 'unknown'))
        
        s3 = S3Manager()
        
        # Find latest result directory
        result_dirs = list(Path('results').glob('run-*'))
        if not result_dirs:
            print('No result directories found')
            exit(0)
        
        latest = max(result_dirs, key=lambda p: p.stat().st_mtime)
        print(f'Uploading results from: {latest}')
        
        # Upload each file with protection
        for file_path in latest.rglob('*'):
            if file_path.is_file():
                s3_key = f'results/run-${{ github.run_number }}/{file_path.relative_to(latest)}'
                location = s3.upload_with_protection(str(file_path), s3_key)
                print(f'  {file_path.name} -> {location}')
        
        # Check if fallback was used
        fallback_dir = Path('local_backup')
        if fallback_dir.exists() and any(fallback_dir.rglob('*')):
            print('WARNING: Some files saved to local fallback storage')
            with open(os.environ['GITHUB_ENV'], 'a') as f:
                f.write('FALLBACK_USED=true\n')
        "
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-east-2
      continue-on-error: true

    - name: Generate monitoring summary
      if: always()
      run: |
        python -c "
        import sys
        import os
        sys.path.append('.')
        from monitoring.correlation import set_correlation_id
        from monitoring.dashboard import WorkflowMonitor
        from pathlib import Path
        import shutil
        
        set_correlation_id(os.environ.get('CORRELATION_ID', 'unknown'))
        
        monitor = WorkflowMonitor('ollama-enterprise')
        monitor.start_monitoring('${{ github.run_number }}', '${{ github.sha }}')
        
        result_dirs = list(Path('results').glob('run-*'))
        if result_dirs:
            latest = max(result_dirs, key=lambda p: p.stat().st_mtime)
        else:
            latest = Path('results/monitoring')
            latest.mkdir(parents=True, exist_ok=True)
        
        summary = monitor.generate_summary(latest)
        
        # Copy logs to results
        if Path('logs').exists():
            logs_dest = latest / 'logs'
            shutil.copytree('logs', logs_dest, dirs_exist_ok=True)
        
        print(f'Duration: {summary[\"duration_seconds\"]}s')
        print(f'Health: {summary[\"health\"][\"checks\"]}')
        "

    - name: Generate test summary
      if: always()
      run: |
        echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        TOTAL=$(grep -c "def test_" tests/*.py || echo "0")
        PASSED=$(grep -c "PASSED" test-output.txt || echo "0")
        FAILED=$(grep -c "FAILED" test-output.txt || echo "0")
        SKIPPED=$(grep -c "SKIPPED" test-output.txt || echo "0")
        
        echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Total Tests | $TOTAL |" >> $GITHUB_STEP_SUMMARY
        echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
        echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
        echo "| ⏭️ Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### 🔗 Correlation Tracking" >> $GITHUB_STEP_SUMMARY
        echo "**Correlation ID:** \`$CORRELATION_ID\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "To trace this run in logs:" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "grep $CORRELATION_ID logs/*.log" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### 🤖 Model Routing" >> $GITHUB_STEP_SUMMARY
        if [ -f analysis_result.txt ]; then
          TASK_TYPE=$(grep "task_type=" analysis_result.txt | cut -d= -f2)
          MODEL_USED=$(grep "model_used=" analysis_result.txt | cut -d= -f2)
          TOTAL_TIME=$(grep "total_time=" analysis_result.txt | cut -d= -f2)
          echo "| Decision | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Task Classification | $TASK_TYPE |" >> $GITHUB_STEP_SUMMARY
          echo "| Model Selected | $MODEL_USED |" >> $GITHUB_STEP_SUMMARY
          echo "| Analysis Time | ${TOTAL_TIME}s |" >> $GITHUB_STEP_SUMMARY
        else
          echo "No routing data available" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### ⚡ Performance Metrics" >> $GITHUB_STEP_SUMMARY
        echo "- Installation Cache Hit: ${{ steps.ollama-cache.outputs.cache-hit }}" >> $GITHUB_STEP_SUMMARY
        echo "- Model Cache Hit: ${{ steps.model-cache.outputs.cache-hit }}" >> $GITHUB_STEP_SUMMARY
        echo "- Workflow Run: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### 🚨 Incident Summary" >> $GITHUB_STEP_SUMMARY
        if [ "$FALLBACK_USED" = "true" ]; then
          echo "⚠️ **Fallback storage was used** - S3 may have been unavailable" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Files saved to \`local_backup/\` directory" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ No incidents detected" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- test-results-run-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- workflow-results-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY

    - name: Upload workflow results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: workflow-results-${{ github.run_number }}
        path: |
          results/
          logs/
          local_backup/
        retention-days: 30